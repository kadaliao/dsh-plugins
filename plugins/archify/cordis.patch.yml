- insert:
    - id: archify
      name: '@kadaliao/dsh-archify'
      config:
        # Offer archify_render / archify_cli to the model.
        enabled: true
        # Serve the bundled `archify` skill to the skill catalog.
        skill: true
        # How long one Archify run may take, in milliseconds.
        timeoutMs: 240000
